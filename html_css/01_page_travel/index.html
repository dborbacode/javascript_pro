<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel</title>
<link rel="stylesheet" href="./css/reset.css">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header id="header">
  <div class="logo"><img src="./assets/icons/logo.png" alt=""></span> Aura Viagens</div>

  <div class="nav-group" id="navGroup">
    <ul class="navegation">

    <li>
      <span class="navegation-icon material-symbols-outlined">
        explore
      </span>
      <a href="#">Destinos</a>
    </li>

    <li>
      <span class="navegation-icon material-symbols-outlined">
        favorite
      </span>
      <a href="#">Experiências</a>
    </li>

    <li>
      <span class="navegation-icon material-symbols-outlined">
        map
      </span>
      <a href="#">Itinerários</a>
    </li>

    <li>
      <span class="navegation-icon material-symbols-outlined">
        info
      </span>
      <a href="#">Sobre</a>
    </li>

    <li>
      <span class="navegation-icon material-symbols-outlined">
        mail
      </span>
      <a href="#">Contato</a>
    </li>

  </ul>
   
  </div>
   <button class="btn-reservation">Reservar Agora</button>
  <button class="hamburguer" id="btnMenu" aria-label="Abrir menu" aria-expanded="false" aria-controls="navGroup">
    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f">
      <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
    </svg>
  </button>
</header>

<main>
  <section class="hero">
    <h1 class="hero-title">Descubra o mundo em sua melhor versão</h1>
    <p>Experiências de luxo sob medida para almas viajantes que buscam o
extraordinário.</p>
  </section>
</main>


<script>
  const header  = document.getElementById('header');
  const btnMenu = document.getElementById('btnMenu');

  btnMenu.addEventListener('click', () => {
    const aberto = header.classList.toggle('aberto');
    btnMenu.setAttribute('aria-expanded', aberto);
    btnMenu.setAttribute('aria-label', aberto ? 'Fechar menu' : 'Abrir menu');
  });
</script>

</body>
</html>
